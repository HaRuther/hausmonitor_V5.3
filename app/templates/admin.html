{% extends 'base.html' %}{% block content %}<h1>Einstellungen</h1><div class=card><h2>Monitoring</h2><form method=post action=/admin/settings class=form><label>Basis-URL für QR-Codes<input name=base_url value="{{s.base_url}}"></label><label>Info-Grenze mm<input type=number step=.1 name=level_info value="{{s.level_info}}"></label><label>Warn-Grenze mm<input type=number step=.1 name=level_warn value="{{s.level_warn}}"></label><label>Alarm-Grenze mm<input type=number step=.1 name=level_alarm value="{{s.level_alarm}}"></label><label>Referenzkampagne<select name=reference_campaign_id><option value="">erste vollständige Kampagne</option>{% for c in campaigns %}<option value={{c.id}} {% if s.reference_campaign_id==c.id %}selected{% endif %}>{{c.measured_at}}</option>{% endfor %}</select></label><label>Risswarnung Standard<input type=number step=.001 name=default_crack_warning value="{{s.default_crack_warning}}"></label><label>Rissalarm Standard<input type=number step=.001 name=default_crack_alarm value="{{s.default_crack_alarm}}"></label><button>Speichern</button></form></div><div class=card><h2>Messgeräte</h2><form method=post action=/admin/devices class=form><input name=name placeholder="Gerätename" required><input name=serial placeholder=Seriennummer><input type=date name=calibrated_at><input name=notes placeholder=Notiz><button>Gerät hinzufügen</button></form><table><tr><th>Name</th><th>Seriennummer</th><th>Kalibrierung</th></tr>{% for d in devices %}<tr><td>{{d.name}}</td><td>{{d.serial}}</td><td>{{d.calibrated_at}}</td></tr>{% endfor %}</table></div><div class=card><h2>Jahresbericht</h2><form method=get action=/reports/year/2026.pdf onsubmit="this.action='/reports/year/'+this.year.value+'.pdf'"><input type=number name=year value=2026 min=2000 max=2100><button>PDF erzeugen</button></form></div>{% endblock %}
