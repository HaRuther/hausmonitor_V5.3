{% extends 'base.html' %}{% block content %}<div class="card narrow"><h1>{{'Messreihe bearbeiten' if c else 'Neue Messreihe'}}</h1><form method=post action="{{'/level/'~c.id~'/edit' if c else '/level'}}" class=form><label>Datum<input type=datetime-local name=measured_at value="{{c.measured_at if c else now}}" required></label><label>Lufttemperatur<input name=air_temp type=number step=.1 value="{{c.air_temp if c and c.air_temp is not none else ''}}"></label><label>Wand SW<input name=wall_temp_sw type=number step=.1 value="{{c.wall_temp_sw if c and c.wall_temp_sw is not none else ''}}"></label><label>Wand SO<input name=wall_temp_so type=number step=.1 value="{{c.wall_temp_so if c and c.wall_temp_so is not none else ''}}"></label><label>Grundwasser<input name=groundwater type=number step=.001 value="{{c.groundwater if c and c.groundwater is not none else ''}}"></label><label>Regen 14 Tage<input name=rainfall_14d type=number step=.1 value="{{c.rainfall_14d if c and c.rainfall_14d is not none else ''}}"></label><label>Wetter<input name=weather value="{{c.weather if c else ''}}"></label><label>Licht<input name=light_mode value="{{c.light_mode if c else ''}}"></label><label>Gerät<select name=device_id><option value="">–</option>{% for d in devices %}<option value={{d.id}} {% if c and c.device_id==d.id %}selected{% endif %}>{{d.name}}</option>{% endfor %}</select></label><label class=wide>Notiz<textarea name=notes>{{c.notes if c else ''}}</textarea></label><button>Speichern</button></form></div>{% endblock %}
