{% extends 'base.html' %}{% block content %}<div class="card narrow"><h1>{{'Messung bearbeiten' if m else 'Neue Messung'}}: {{p.name}}</h1><form method=post enctype=multipart/form-data action="{{'/cracks/'~p.id~'/measurements/'~m.id~'/edit' if m else '/cracks/'~p.id~'/measurements'}}" class=form><label>Datum<input type=datetime-local name=measured_at value="{{m.measured_at if m else now}}" required></label><label>Lufttemperatur<input type=number step=.1 name=air_temp value="{{m.air_temp if m and m.air_temp is not none else ''}}"></label><label>Messwert<input type=number step=.001 name=value value="{{m.value if m else ''}}" required></label><label class=wide>Notiz<textarea name=notes>{{m.notes if m else ''}}</textarea></label><label class=wide>Foto<input type=file name=photo accept=image/* capture=environment></label><button>Speichern</button></form></div>{% endblock %}
