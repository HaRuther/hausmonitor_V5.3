{% extends 'base.html' %}{% block content %}<div class="card narrow"><h1>{{'Messstelle bearbeiten' if p else 'Neue Messstelle'}}</h1><form method=post action="{{'/cracks/'~p.id~'/edit' if p else '/cracks'}}" class=form><label>Name<input name=name value="{{p.name if p else ''}}" required></label><label>Ort<input name=location value="{{p.location if p else ''}}"></label><label>Rissart<input name=crack_type value="{{p.crack_type if p else ''}}"></label><label>Einheit<input name=unit value="{{p.unit if p else 'mm'}}"></label><label>Referenz<input type=number step=.001 name=reference_value value="{{p.reference_value if p and p.reference_value is not none else ''}}"></label><label>Warnung<input type=number step=.001 name=warning_delta value="{{p.warning_delta if p else defaults.default_crack_warning}}"></label><label>Alarm<input type=number step=.001 name=alarm_delta value="{{p.alarm_delta if p else defaults.default_crack_alarm}}"></label><label class=wide>Beschreibung<textarea name=description>{{p.description if p else ''}}</textarea></label><button>Speichern</button></form></div>{% endblock %}
